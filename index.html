.hdr .sign{position:relative;z-index:2;width:120px;margin:22px auto 0;transform-origin:50% -20px;animation:swing 6s ease-in-out infinite}
.hdr.big .sign{width:200px;margin-top:30px}
.hdr .sign img{display:block;width:100%;border-radius:14px;box-shadow:0 14px 26px rgba(0,0,0,.65),0 0 0 2px rgba(255,214,150,.25)}
.hdr .rope{position:absolute;top:-40px;width:4px;height:44px;background:repeating-linear-gradient(160deg,#c9a46a 0 3px,#7c5a2c 3px 6px);border-radius:2px;box-shadow:0 2px 3px rgba(0,0,0,.4)}
.hdr .rope.l{left:18%;transform:rotate(-8deg)}.hdr .rope.r{right:18%;transform:rotate(8deg)}
@keyframes swing{0%,100%{transform:rotate(-1.2deg)}50%{transform:rotate(1.2deg)}}
.hdr .lang{position:absolute;right:12px;top:12px;z-index:3;display:flex;border-radius:999px;overflow:hidden;background:rgba(15,8,4,.75);box-shadow:inset 0 0 0 1.5px rgba(247,194,52,.6),0 4px 10px rgba(0,0,0,.4)}
.lang button{background:none;border:0;padding:7px 13px;font-weight:700;font-size:14px;color:var(--cream)}
.lang button.on{background:var(--gold);color:var(--ink)}
.hdr .hsub{position:relative;z-index:2;margin:10px 0 0;text-align:center;font-family:var(--brush);font-size:22px;color:#fff;text-shadow:0 2px 6px rgba(0,0,0,.9)}

/* ---------- footer ---------- */
.copy{max-width:620px;margin:18px auto 0;padding:0 14px calc(10px + env(safe-area-inset-bottom));text-align:center}
.copy .tel{display:inline-flex;align-items:center;gap:8px;padding:8px 26px;border-radius:999px;background:#0f0905;box-shadow:inset 0 0 0 3px var(--gold),0 6px 14px rgba(0,0,0,.5);font-weight:800;font-size:22px;color:#fff;text-decoration:none;letter-spacing:.5px}
.copy .cr{display:flex;justify-content:center;flex-wrap:wrap;gap:4px 14px;margin:10px 0 0;font-size:11.5px;color:#e9dcc6}
.copy .kraft{margin:10px -14px 0;padding:10px 18px;background:repeating-linear-gradient(0deg,rgba(0,0,0,.04) 0 2px,transparent 2px 5px),linear-gradient(180deg,#e9cf9d,#d8b779);color:#3a230f;font-family:var(--brush);font-size:15px;line-height:1.3;box-shadow:inset 0 3px 6px rgba(0,0,0,.25);clip-path:polygon(0 8%,4% 0,12% 6%,22% 1%,35% 7%,48% 2%,60% 6%,72% 0,85% 6%,95% 1%,100% 8%,100% 100%,0 100%)}

/* ---------- typography ---------- */
.hero{text-align:center;padding:4px 0}
.hero img{display:none}
h1{font-family:var(--brush);font-weight:400;font-size:38px;line-height:1.1;margin:12px 0 8px;color:#fff;text-shadow:0 3px 0 rgba(0,0,0,.45),0 6px 16px rgba(0,0,0,.6)}
h1:not(.chalkh){color:var(--acc)}
h2{font-family:var(--brush);font-weight:400;font-size:30px;margin:18px 0 8px;color:#fff;text-shadow:0 2px 8px rgba(0,0,0,.7)}
h3{margin:0 0 6px;font-size:18px}
p{margin:6px 0}
.muted{color:var(--muted)}
.center{text-align:center}
.chalk{font-family:var(--chalk);font-weight:400}
.brush{font-family:var(--brush);font-weight:400}
.sec,.chalkh{font-family:var(--brush)!important;font-weight:400;color:#fff!important;text-transform:none!important;letter-spacing:0!important;text-shadow:0 3px 8px rgba(0,0,0,.7)!important}
.sec{display:block;width:fit-content;margin:24px 0 8px;font-size:30px;line-height:1.1;padding-bottom:10px;background:var(--u) left bottom/100% 12px no-repeat}
.chalkh{font-size:38px!important;margin:6px 0 8px!important;padding-bottom:10px;background:var(--u) left bottom/min(100%,320px) 12px no-repeat}

/* ---------- cards: chalkboard in a wooden frame ---------- */
.card{position:relative;background:var(--chalkboard);border:4px solid transparent;border-radius:18px;padding:16px;margin:14px 0;
  background-clip:padding-box;box-shadow:0 0 0 4px #6b4220,0 0 0 5px rgba(0,0,0,.6),inset 0 0 0 1px rgba(255,214,150,.15),inset 0 0 34px rgba(0,0,0,.5),0 14px 28px rgba(0,0,0,.6);margin-left:6px;margin-right:6px}
.card::before{content:"";position:absolute;inset:-9px;border-radius:24px;z-index:-1;background:var(--woodframe)}
.card .muted{color:#cfc6b6}

/* ---------- buttons ---------- */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:50px;border:0;border-radius:12px;padding:12px 16px;font-family:var(--body);font-weight:800;font-size:16px;background:linear-gradient(180deg,#ffd955,#f4b51f 55%,#e9a40f);color:var(--ink);box-shadow:inset 0 2px 0 rgba(255,255,255,.6),inset 0 -3px 0 rgba(0,0,0,.15),0 4px 0 #9b6609,0 8px 16px rgba(0,0,0,.45);transition:transform .08s;text-decoration:none;line-height:1.15;text-align:center}
.btn:active{transform:translateY(3px);box-shadow:inset 0 2px 0 rgba(255,255,255,.6),0 1px 0 #9b6609}
.btn.acc{background:var(--acc);color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.4);box-shadow:inset 0 2px 0 rgba(255,255,255,.3),inset 0 -3px 0 rgba(0,0,0,.2),0 8px 16px rgba(0,0,0,.45)}
.btn.ghost{background:linear-gradient(180deg,rgba(90,54,24,.92),rgba(52,30,13,.92));color:#fff;box-shadow:inset 0 0 0 1.5px rgba(247,194,52,.45),0 6px 12px rgba(0,0,0,.4)}
.btn.small{min-height:42px;padding:9px 12px;font-size:14px;width:auto}
.btn.danger{background:rgba(229,72,61,.12);color:#ff8a80;box-shadow:inset 0 0 0 1.5px rgba(229,72,61,.75)}
.btn[disabled]{opacity:.45}
.brushbtn{flex:none;border:0;padding:12px 22px 12px 18px;font-family:var(--brush);font-size:24px;color:var(--ink);background:var(--gold);transform:rotate(-4deg);
  clip-path:polygon(3% 12%,12% 2%,40% 6%,70% 0,96% 8%,100% 45%,97% 88%,70% 100%,35% 94%,8% 100%,0 60%);filter:drop-shadow(0 4px 6px rgba(0,0,0,.5));box-shadow:none}
.brushbtn:active{transform:rotate(-4deg) scale(.96)}
.row{display:flex;gap:10px;align-items:center}
.row>*{flex:1}
.stack>*+*{margin-top:10px}
.bar2{display:flex;align-items:center;gap:12px;width:100%;margin:10px 0 0;padding:11px 16px;border:0;border-radius:14px;background:linear-gradient(180deg,rgba(74,44,18,.95),rgba(40,22,9,.95));box-shadow:inset 0 0 0 1.5px rgba(247,194,52,.5),0 6px 14px rgba(0,0,0,.45);color:#fff;font-weight:600;font-size:17px;text-align:left}
.bar2 i{font-style:normal;font-size:22px}.bar2 span{flex:1}.bar2 b{font-size:26px;line-height:1;color:var(--gold)}

/* ---------- forms ---------- */
label.f{display:block;font-size:13px;color:var(--gold2);font-weight:600;margin:12px 0 5px}
input.in,textarea.in,select.in{width:100%;background:var(--paper);color:var(--ink);border:0;border-radius:12px;padding:12px 14px;font-size:17px;outline:none;box-shadow:inset 0 2px 4px rgba(0,0,0,.18),0 0 0 1.5px rgba(0,0,0,.3)}
input.in::placeholder,textarea.in::placeholder{color:#a9926f}
input.in:focus,textarea.in:focus,select.in:focus{box-shadow:0 0 0 3px var(--gold)}
textarea.in{min-height:64px;resize:vertical;font-size:15px}
.big-in{font-size:22px!important;font-weight:700;text-align:center}
.pill{display:inline-block;padding:4px 12px;border-radius:999px;font-size:12px;font-weight:600;background:rgba(0,0,0,.4);box-shadow:inset 0 0 0 1px rgba(247,194,52,.7);color:var(--gold2)}
.kind{display:inline-block;font-family:var(--brush);font-size:20px;line-height:1;padding:6px 16px 5px;border-radius:999px;background:rgba(0,0,0,.45);box-shadow:inset 0 0 0 1.5px rgba(247,194,52,.6);color:#fff}

/* ---------- participant ---------- */
.prog{height:10px;border-radius:99px;background:rgba(0,0,0,.45);overflow:hidden;margin:6px 0 14px;box-shadow:inset 0 0 0 1px rgba(255,240,210,.15)}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),color-mix(in srgb,var(--acc) 55%,#fff));border-radius:99px;transition:width .25s}
.qnum{font-family:var(--brush);font-size:26px;color:#fff;text-shadow:0 2px 6px rgba(0,0,0,.7)}
.qtext{position:relative;font-family:var(--chalk);font-size:32px;line-height:1.15;color:var(--chalkc);margin:10px 6px 16px;padding:22px 20px;min-height:4.4em;display:flex;align-items:center;background:var(--chalkboard);border-radius:16px;box-shadow:0 0 0 7px #6b4220,0 0 0 9px rgba(0,0,0,.6),inset 0 0 40px rgba(0,0,0,.5),0 14px 28px rgba(0,0,0,.6);text-shadow:0 0 1px rgba(255,255,255,.5)}
.opt{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:linear-gradient(180deg,var(--paper),var(--paper2));color:var(--ink);border:0;border-radius:14px;padding:12px 14px;margin:10px 0;font-size:18px;font-weight:700;box-shadow:0 4px 0 #b49460,0 8px 16px rgba(0,0,0,.4);transition:transform .08s}
.opt:active{transform:translateY(3px);box-shadow:0 1px 0 #b49460}
.opt .L{flex:none;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-family:var(--title);font-size:21px;background:var(--ink);color:var(--gold2)}
.opt.sel{background:var(--acc);color:#fff;box-shadow:0 4px 0 color-mix(in srgb,var(--acc) 55%,#000),0 0 18px color-mix(in srgb,var(--acc) 60%,transparent);text-shadow:0 1px 2px rgba(0,0,0,.35)}
.opt.sel .L{background:#fff;color:var(--ink)}
.chk{flex:none;width:30px;height:30px;border-radius:9px;background:#fff;box-shadow:inset 0 0 0 2px var(--ink);display:grid;place-items:center;font-weight:800;color:var(--ink)}
.opt.sel .chk{color:var(--acc);box-shadow:none}
.nav{display:flex;gap:10px;margin-top:18px}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.tile{border:0;border-radius:12px;padding:6px 0;text-align:center;background:var(--paper);color:var(--ink);box-shadow:0 3px 0 #b49460}
.tile b{display:block;font-family:var(--title);font-size:22px;font-weight:400;color:var(--acc)}
.tile small{color:#7a6448;font-size:11px;font-weight:600}
.tile.empty{background:#ffe1dc}.tile.empty b{color:var(--bad)}
.stars{display:flex;gap:6px;justify-content:center;margin:22px 0}
.stars button{background:none;border:0;font-size:52px;line-height:1;padding:0;filter:grayscale(1) brightness(.55);transition:transform .1s}
.stars button.on{filter:drop-shadow(0 0 10px rgba(247,194,52,.7));transform:scale(1.08)}
.qrbox{margin-top:22px;position:relative;background:#fff;border-radius:12px;padding:16px;display:inline-block;box-shadow:0 16px 40px rgba(0,0,0,.6);transform:rotate(-1deg)}
.qrbox::before,.qrbox::after{content:"";position:absolute;top:-12px;width:80px;height:24px;background:rgba(240,226,180,.85);box-shadow:0 1px 3px rgba(0,0,0,.3)}
.qrbox::before{left:-16px;transform:rotate(-28deg)}.qrbox::after{right:-16px;transform:rotate(28deg)}
.qrbox svg{display:block;width:min(72vw,320px);height:auto}

/* ---------- host ---------- */
.list .it{display:flex;align-items:center;gap:12px;padding:12px 8px;border-bottom:1px dashed rgba(246,242,232,.2)}
.list .it:last-child{border-bottom:0}
.rank{font-family:var(--brush);font-size:26px;width:40px;text-align:center;color:var(--gold2)}
.score{font-family:var(--brush);font-size:30px;color:var(--gold2);text-shadow:0 2px 6px rgba(0,0,0,.6)}
.it .nm{flex:1;min-width:0;font-weight:600;font-size:17px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.it .nm small{display:block;font-weight:400;color:#cfc6b6;font-size:12px}
.toast{position:fixed;left:50%;top:16px;transform:translateX(-50%);background:var(--ok);color:#06210f;font-weight:700;padding:12px 18px;border-radius:14px;z-index:60;box-shadow:0 10px 24px rgba(0,0,0,.4);max-width:92vw;text-align:center}
.modal{position:fixed;inset:0;background:rgba(10,5,2,.8);backdrop-filter:blur(3px);display:grid;place-items:center;z-index:30;padding:22px}
.modal .card{max-width:440px;width:100%}
.draw{font-family:var(--brush);font-size:44px;line-height:1.1;color:var(--gold2);text-align:center;min-height:2.4em;display:grid;place-items:center;word-break:break-word}
.winner{animation:pop .6s ease}
@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.15)}100%{transform:scale(1)}}
.conf{position:fixed;top:-20px;width:10px;height:14px;z-index:40;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
.qe{border-left:6px solid var(--acc)!important}
.optrow{display:flex;gap:8px;align-items:flex-start;margin-top:8px}
.optrow .rad{flex:none;width:40px;height:40px;border-radius:50%;border:0;background:var(--paper);font-family:var(--title);font-size:19px;color:var(--ink);box-shadow:0 2px 0 #b49460}
.optrow .rad.on{background:var(--ok);color:#fff}
.optrow .two{flex:1;display:grid;gap:6px}
.optrow input{font-size:15px!important;padding:8px 10px!important}
.colors{display:flex;gap:10px;flex-wrap:wrap}
.colors button{width:38px;height:38px;border-radius:50%;border:0;box-shadow:0 3px 8px rgba(0,0,0,.4)}
.colors button.on{outline:3px solid #fff;outline-offset:2px}
.navb{display:flex;gap:10px;margin:0 0 8px;position:sticky;top:0;z-index:4;padding:8px 0;background:linear-gradient(180deg,rgba(29,17,10,.96) 75%,rgba(29,17,10,0))}
.navb .btn{flex:1}
.tabs{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:10px 0 4px}
.tabs button{flex:none;border:0;background:rgba(0,0,0,.4);box-shadow:inset 0 0 0 1.5px rgba(247,194,52,.45);border-radius:999px;padding:8px 16px;font-weight:600;font-size:14px;color:#fff}
.tabs button.on{background:var(--gold);color:var(--ink);box-shadow:none}
.gtitle{display:block;font-family:var(--brush);font-weight:400;font-size:30px;line-height:1.1;margin-top:8px}
.bar{position:relative;background:rgba(0,0,0,.4);border-radius:10px;height:36px;margin:7px 0;overflow:hidden;box-shadow:inset 0 0 0 1px rgba(255,240,210,.18)}
.bar i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,color-mix(in srgb,var(--acc) 80%,#000),var(--acc))}
.bar span{position:absolute;left:12px;right:12px;top:0;bottom:0;display:flex;align-items:center;justify-content:space-between;font-size:14px;font-weight:600;gap:8px;text-shadow:0 1px 2px #000}
.bar span b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.txtans{font-family:var(--chalk);font-size:23px;line-height:1.15;color:var(--chalkc);background:rgba(255,255,255,.05);border-radius:12px;padding:9px 12px;margin:7px 0;box-shadow:inset 0 0 0 1px rgba(246,242,232,.2)}
.txtans small{display:block;font-family:var(--body);color:#cfc6b6;font-size:12px}
.ans{display:flex;gap:6px;flex-wrap:wrap}
.full{position:fixed;inset:0;background:var(--paper);z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:var(--ink);padding:20px;text-align:center}
.full svg{width:min(84vw,62vh);height:auto;border-radius:12px;background:#fff;box-shadow:0 14px 36px rgba(0,0,0,.25)}
.full h1{margin:0;font-size:34px;text-shadow:none}
.full .x{position:absolute;top:14px;right:14px}
.full .btn.ghost{color:var(--ink);background:none;box-shadow:inset 0 0 0 1.5px rgba(42,20,6,.35)}
.fb{background:linear-gradient(180deg,#4a95ff,#1664d9)!important;color:#fff!important;box-shadow:0 4px 0 #0e47a1,0 8px 16px rgba(0,0,0,.35)!important}

/* ---------- home ---------- */
.homehead{display:flex;align-items:center;gap:10px;margin:2px 0 14px}
.homehead p{flex:1;margin:0;font-size:31px;line-height:1.1;color:#fff;text-shadow:0 3px 8px rgba(0,0,0,.8)}
.homehead p em{font-style:normal;color:var(--gold);font-size:1.25em;padding-bottom:4px;background:var(--u) left bottom/100% 10px no-repeat}
.cats{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:6px 0 4px}
.cat{position:relative;display:flex;align-items:flex-end;justify-content:center;aspect-ratio:1.5;border:3px solid var(--c);border-radius:18px;overflow:hidden;padding:0 6px 12px;background:#111 center/cover no-repeat;
  box-shadow:0 0 0 1px rgba(0,0,0,.6),0 0 16px color-mix(in srgb,var(--c) 75%,transparent),0 0 34px color-mix(in srgb,var(--c) 35%,transparent),inset 0 0 12px color-mix(in srgb,var(--c) 45%,transparent);transition:transform .1s}
.cat::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 40%,rgba(0,0,0,.65) 100%)}
.cat:active{transform:scale(.97)}

.hc{padding:14px}
.hc-h{display:flex;align-items:center;gap:12px}
.hc-ic{flex:none;width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font-size:26px;box-shadow:inset 0 0 0 3px rgba(255,255,255,.85),0 0 14px rgba(0,0,0,.5)}
.hc-t{flex:1;min-width:0}
.hc-t small{display:block;font-size:12px;font-weight:800;color:var(--gold);text-transform:uppercase;letter-spacing:.8px}
.hc-t b{display:block;font-family:var(--brush);font-weight:400;font-size:26px;line-height:1.08;color:#fff!important;text-shadow:0 2px 6px rgba(0,0,0,.6);margin:2px 0}
.hc-t span{display:block;font-size:13px;color:#cfc6b6}
.hc .row .btn{font-size:15px}
.cnt{position:absolute;top:-9px;right:-6px;background:var(--red);color:#fff;font-family:var(--body);font-style:normal;font-weight:700;font-size:12px;border-radius:99px;padding:2px 8px;box-shadow:0 0 0 2px #151617}
.mini{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:12px;padding-top:10px;border-top:1px dashed rgba(246,242,232,.22)}
.mini button{display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:0;border-radius:12px;padding:6px 2px;color:#fff;font-size:11.5px;font-weight:600;line-height:1.15;text-align:center}
.mini button i{font-style:normal;font-size:19px;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.08);box-shadow:inset 0 0 0 1px rgba(247,194,52,.45)}
.tw{overflow-x:auto;margin:0 -4px;-webkit-overflow-scrolling:touch}
.pt-t{border-collapse:separate;border-spacing:3px;font-size:14px;min-width:100%}
.pt-t th{font-size:11px;font-weight:600;color:var(--gold2);padding:4px 6px;line-height:1.2;white-space:nowrap;text-align:center}
.pt-t th:first-child{text-align:left}
.pt-t td{text-align:center;padding:7px 6px;border-radius:8px;background:rgba(255,255,255,.06);font-weight:700;white-space:nowrap}
.pt-t td.nm{text-align:left;font-weight:600;max-width:130px;overflow:hidden;text-overflow:ellipsis;position:sticky;left:0;background:#1c1d1e}
.pt-t td.pt{font-family:var(--brush);font-size:22px;color:var(--gold2);background:none}
.pt-t td.px{background:#2a9d5c;color:#fff}.pt-t td.pw{background:#b8861a;color:#fff}.pt-t td.pl{background:rgba(229,72,61,.35)}.pt-t td.pm{color:#9c9384;font-weight:400}
.pt-t tr.rr td{background:rgba(247,194,52,.2);color:var(--gold2)}
.pt-t tr[data-k]{cursor:pointer}

.hdr2 .rlogo{position:relative;z-index:2;flex:none;width:96px;height:96px;border-radius:50%;object-fit:cover;border:3px solid #e8c47a;box-shadow:0 0 0 3px #2a1608,0 8px 18px rgba(0,0,0,.7)}
.hdr2 .plank{position:relative;z-index:2;flex:1;max-width:330px;padding:8px 14px 10px;border-radius:10px;background:repeating-linear-gradient(0deg,rgba(0,0,0,.18) 0 1px,transparent 1px 9px),repeating-linear-gradient(90deg,rgba(255,255,255,.04) 0 2px,transparent 2px 14px),linear-gradient(180deg,#8b5a2b,#5a3417);box-shadow:inset 0 2px 0 rgba(255,255,255,.2),inset 0 -3px 0 rgba(0,0,0,.35),0 8px 18px rgba(0,0,0,.6);margin-right:40px}
.hdr2 .plank b{display:block;font-family:var(--title);font-weight:400;font-size:clamp(30px,9vw,42px);line-height:1;color:#f6ead2;letter-spacing:1px;text-shadow:0 3px 0 #2a1608,0 5px 10px rgba(0,0,0,.6)}
.hdr2 .plank span{display:inline-block;margin-top:2px;font-family:var(--brush);font-size:clamp(18px,5.4vw,25px);line-height:1.1;color:var(--gold);padding-bottom:6px;background:var(--u) left bottom/100% 8px no-repeat;text-shadow:0 2px 3px rgba(0,0,0,.6);white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.hdr2 .lang{position:absolute;right:10px;top:8px;z-index:3;display:flex;border-radius:999px;overflow:hidden;background:rgba(15,8,4,.8);box-shadow:inset 0 0 0 1.5px rgba(247,194,52,.6)}
.navb .btn,.btn.ghost{background:repeating-linear-gradient(0deg,rgba(0,0,0,.14) 0 1px,transparent 1px 8px),linear-gradient(180deg,#8b5a2b,#5a3417);color:#fff;border-radius:999px;box-shadow:inset 0 2px 0 rgba(255,255,255,.22),inset 0 -2px 0 rgba(0,0,0,.3),0 0 0 2px rgba(232,170,70,.55),0 6px 12px rgba(0,0,0,.5);text-shadow:0 2px 2px rgba(0,0,0,.5)}
.navb{background:linear-gradient(180deg,rgba(20,11,5,.9) 70%,rgba(20,11,5,0))}
.navb .btn{font-size:17px;min-height:46px}
.band{position:relative;display:flex;align-items:center;gap:12px;margin:14px -14px 12px;padding:10px 16px;background:linear-gradient(90deg,rgba(10,6,20,.85),rgba(20,12,30,.55) 60%,rgba(10,6,20,.2));box-shadow:0 1px 0 rgba(255,255,255,.06),0 -1px 0 rgba(0,0,0,.4)}
.band .bic{flex:none;width:72px;height:72px;border-radius:50%;box-shadow:0 0 18px rgba(80,150,255,.55);background-position:center;background-size:cover;background-repeat:no-repeat}
.band b{font-family:var(--brush);font-weight:400;font-size:46px;line-height:1;color:#fff;padding-bottom:8px;background:var(--u) left bottom/100% 10px no-repeat;text-shadow:0 3px 8px rgba(0,0,0,.8)}
.band span{margin-left:auto;font-family:var(--brush);font-size:21px;color:#fff;padding-bottom:6px;background:var(--u) left bottom/100% 7px no-repeat;text-align:right;line-height:1.1}

.ncard .hc-h{position:relative;z-index:1;padding-right:76px}
.ncard .hc-ic{width:70px;height:70px;border-radius:50%;background:var(--c);box-shadow:inset 0 0 0 3px rgba(255,255,255,.85),0 0 16px color-mix(in srgb,var(--c) 70%,transparent);display:grid;place-items:center}
.ncard .hc-ic i{display:block;width:54px;height:54px;border-radius:50%;background-position:center;background-size:cover;background-repeat:no-repeat}
.ncard .hc-t small{color:var(--gold);font-size:13px}
.ncard .hc-t b{font-family:var(--brush);font-size:27px;color:#fff;text-shadow:0 2px 6px rgba(0,0,0,.7)}
.ncard .hc-t span{color:#ece4d6;font-size:14px}
.nbtns{position:relative;z-index:1;margin-top:12px}
.nbtns .btn{min-height:52px;font-size:17px;border-radius:14px}
.cbtn{background:linear-gradient(180deg,color-mix(in srgb,var(--c) 75%,#fff),var(--c) 45%,color-mix(in srgb,var(--c) 75%,#000))!important;color:#fff!important;text-shadow:0 2px 2px rgba(0,0,0,.5);box-shadow:inset 0 2px 0 rgba(255,255,255,.35),0 4px 0 color-mix(in srgb,var(--c) 55%,#000),0 8px 16px rgba(0,0,0,.45)!important}
.plankbar{display:grid;grid-template-columns:repeat(4,1fr);margin:8px 0 6px;padding:10px 4px 8px;border-radius:12px;background:repeating-linear-gradient(0deg,rgba(0,0,0,.15) 0 1px,transparent 1px 10px),repeating-linear-gradient(90deg,rgba(255,255,255,.035) 0 2px,transparent 2px 16px),linear-gradient(180deg,#7a4b22,#4a2a10);box-shadow:inset 0 2px 0 rgba(255,255,255,.18),inset 0 -3px 0 rgba(0,0,0,.35),0 8px 16px rgba(0,0,0,.55)}
.plankbar button{display:flex;flex-direction:column;align-items:center;gap:4px;background:none;border:0;border-left:2px solid rgba(232,170,70,.35);padding:2px 4px;color:#fff;font-size:12.5px;font-weight:700;line-height:1.15;text-align:center;text-shadow:0 2px 2px rgba(0,0,0,.6)}
.plankbar button:first-child{border-left:0}
.plankbar button i{font-style:normal;font-size:24px;width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,#3a2a1c,#120b06);box-shadow:0 0 0 3px #d9a64a,0 3px 6px rgba(0,0,0,.6)}

.pod-spot{position:absolute;left:50%;top:-10%;width:140%;height:90%;transform:translateX(-50%);background:conic-gradient(from 160deg at 50% 0,transparent 0 12deg,rgba(255,230,160,.13) 18deg 24deg,transparent 30deg 330deg,rgba(255,230,160,.13) 336deg 342deg,transparent 348deg);animation:spot 6s ease-in-out infinite alternate;pointer-events:none}
@keyframes spot{from{transform:translateX(-50%) rotate(-8deg)}to{transform:translateX(-50%) rotate(8deg)}}
.pod-x{position:absolute;right:14px;top:calc(12px + env(safe-area-inset-top));z-index:2;width:44px;height:44px;border-radius:50%;border:0;background:rgba(0,0,0,.55);color:#fff;font-size:20px;box-shadow:0 0 0 2px rgba(232,170,70,.6)}

.pod-ti{position:relative;font-family:var(--brush);font-size:26px;color:var(--gold);margin:8px 0 0;padding-bottom:6px;background:var(--u) center bottom/80% 7px no-repeat}
.pod-stage{position:relative;flex:1;width:100%;max-width:560px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.pod-tap{font-size:16px;color:#e8d8bd;animation:blink 1.4s ease-in-out infinite;margin:10px 0 0}
@keyframes blink{50%{opacity:.35}}
.pod-pl{font-family:var(--brush);font-size:clamp(30px,9vw,46px);margin:0;text-shadow:0 3px 10px #000;animation:podIn .5s ease-out}
.pod-cd{font-family:var(--title);font-size:120px;line-height:1;color:var(--gold);text-shadow:0 0 30px rgba(247,194,52,.7);animation:cd .8s ease-out}
@keyframes cd{from{transform:scale(2.2);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes podIn{from{transform:translateY(20px);opacity:0}to{transform:none;opacity:1}}
.pod-card{display:flex;flex-direction:column;align-items:center;gap:4px;padding:18px 26px 20px;border-radius:20px;min-width:70%;background:linear-gradient(160deg,#1d1f22,#0d0e10);border:3px solid var(--pc);box-shadow:0 0 22px var(--pc),inset 0 0 20px color-mix(in srgb,var(--pc) 35%,transparent);animation:pop .7s cubic-bezier(.2,1.6,.4,1)}
.pc1{--pc:#f7c234}.pc2{--pc:#cfd6de}.pc3{--pc:#d88a4a}
.pod-med{font-size:64px;line-height:1}
.pod-card b{font-family:var(--brush);font-weight:400;font-size:clamp(32px,10vw,54px);line-height:1.1}
.pod-card small{font-size:20px;color:var(--gold);font-weight:700}
@keyframes pop{from{transform:scale(.2) rotate(-8deg);opacity:0}to{transform:none;opacity:1}}
.pod-final{display:flex;align-items:flex-end;justify-content:center;gap:8px;width:100%}
.pf{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;animation:podIn .6s ease-out both}
.pf b{font-family:var(--brush);font-weight:400;font-size:clamp(18px,5.5vw,28px);line-height:1.1;word-break:break-word}
.pf small{color:var(--gold);font-weight:700}
.pf-blk{width:100%;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:8px;border-radius:12px 12px 0 0;font-size:34px;background:repeating-linear-gradient(0deg,rgba(0,0,0,.15) 0 1px,transparent 1px 10px),linear-gradient(180deg,#8b5a2b,#4a2a10);box-shadow:inset 0 2px 0 rgba(255,255,255,.2),0 0 0 2px rgba(232,170,70,.6)}
.pf-blk span{font-family:var(--title);font-size:42px;color:#f6ead2;text-shadow:0 3px 0 #2a1608}
.pf1 .pf-blk{height:190px}.pf2 .pf-blk{height:140px}.pf3 .pf-blk{height:105px}
.pf1{animation-delay:.5s}.pf2{animation-delay:.25s}
.pod-bravo{font-family:var(--brush);font-size:30px;color:var(--gold);margin:6px 0 0}
#print{display:none}
@media print{
  body{background:#fff}
  #app,.copy,.toast,.modal,.full{display:none!important}
  #print{display:block;color:#1a1008;font-family:var(--body);text-align:center}
  #print img{width:46mm;border-radius:6mm}
  #print h1{color:#1a1008;font-size:30pt;margin:6mm 0 2mm;text-shadow:none}
  #print .q svg{width:120mm;height:auto}
  #print p{font-size:15pt;margin:2mm 0}
  #print small{font-size:9pt;color:#555}
  @page{size:A4;margin:14mm}
}

async function fetchResults(g) {

const sgn = x => x > 0 ? 1 : x < 0 ? -1 : 0;
function pronoPoints(g, a, out) {
  let pts = 0, d1 = 0, d2 = 0; const per = [];
  g.questions.forEach((q, i) => {
    const ty = q.type || 'single', r = out ? out[i] : null, p = a[i]; let got = 0;
    if (!answered(r)) { per.push(null); return; }
    if (ty === 'score') {
      if (answered(p)) {
        if (sgn(p[0] - p[1]) === sgn(r[0] - r[1])) { got += 3; if (p[0] - p[1] === r[0] - r[1]) got += 2; if (p[0] === r[0] && p[1] === r[1]) got += 5; }
        d1 += Math.abs(p[0] - r[0]) + Math.abs(p[1] - r[1]);
      } else d1 += 99;
    } else if (ty === 'number') { if (answered(p)) { if (+p === +r) got = 1; d2 += Math.abs(+p - +r); } else d2 += 999; }
    else if (ty === 'multi') { if (answered(p) && [...p].sort().join() === [...r].sort().join()) got = 1; }
    else if (p === r) got = 1;
    pts += got; per.push(got);
  });
  return { pts, d1, d2, per };
}

/* ---- summary of all predictions ---- */
function hostPronoSummary(sel) {
  setAcc('#2fbf6b');
  const gs = allGames().filter(g => isProno(g) && Object.keys(getRes(g.id)).length).sort((a, b) => ((b.date || '') + (b.time || '')).localeCompare((a.date || '') + (a.time || '')));
  // overall ranking by person (name + contact)
  const tot = {};
  gs.forEach(g => { const out = getOut(g.id); pronoRanked(g).forEach(r => { const k = r.k || r.t.toLowerCase(); const o = tot[k] || (tot[k] = { t: r.t, pts: 0, n: 0, ex: 0 }); o.n++; if (out) { o.pts += r.pts; scoreQs(g).forEach(([q, i]) => { if (answered(out[i]) && answered(r.a[i]) && r.a[i][0] === out[i][0] && r.a[i][1] === out[i][1]) o.ex++; }); } }); });
  const overall = Object.values(tot).sort((a, b) => b.pts - a.pts || b.ex - a.ex || b.n - a.n);
  const cell = (p, r) => {
    if (!answered(p)) return '<td class="pm">–</td>';
    const txt = `${p[0]}-${p[1]}`;
    if (!answered(r)) return `<td>${txt}</td>`;
    const cls = p[0] === r[0] && p[1] === r[1] ? 'px' : sgn(p[0] - p[1]) === sgn(r[0] - r[1]) ? 'pw' : 'pl';
    return `<td class="${cls}">${txt}</td>`;

  const table = g => {

    const head = sq.map(([q]) => `<th>${esc(qA(g, q).slice(0, 12))}<br><small>${esc(qB(g, q).slice(0, 12))}</small></th>`).join('');
    const resRow = `<tr class="rr"><td>🏁 ${esc(t('real'))}</td>${sq.map(([q, i]) => `<td>${out && answered(out[i]) ? out[i].join('-') : '…'}</td>`).join('')}<td></td></tr>`;
    let pos = 0, prev = null;
    const rows = rk.map((r, j) => { if (r.pts !== prev) { pos = j + 1; prev = r.pts; } return `<tr data-k="${esc(r.k || r.t.toLowerCase())}" data-g="${esc(g.id)}"><td class="nm">${out ? (['🥇', '🥈', '🥉'][pos - 1] || pos) + ' ' : ''}${esc(r.t)}</td>${sq.map(([q, i]) => cell(r.a[i], out && out[i])).join('')}<td class="pt">${out ? r.pts : '·'}</td></tr>`; }).join('');
    return `<div class="card" style="padding:12px"><p class="chalk" style="font-size:26px;margin:0 0 2px">${SPORT_ICON[g.sport] || '🏆'} ${esc(gTitle(g))}</p><p class="muted" style="margin:0 0 8px;font-size:13px">${esc(fmtDate(g.date))} · ${esc(t('pronos')(rk.length))}</p>
      <div class="tw"><table class="pt-t"><thead><tr><th>${esc(t('playerL'))}</th>${head}<th>Pts</th></tr></thead><tbody>${resRow}${rows}</tbody></table></div>
      <div class="row" style="margin-top:10px"><button class="btn ghost small" data-open="${esc(g.id)}">🏆 ${esc(t('ranking'))}</button><button class="btn ghost small" data-fr="${esc(g.id)}">🔄 ${esc(t('fetchBtn'))}</button></div></div>`;
  };

    ${!gs.length ? `<div class="card center"><p class="chalk" style="font-size:24px;margin:0">${esc(t('noRes'))}</p></div>` : `
    <p class="sec">🏆 ${esc(t('bestT'))}</p><div class="card list" style="padding:4px 8px">${overall.map((o, i) => `<div class="it"><span class="rank">${['🥇', '🥈', '🥉'][i] || i + 1}</span><span class="nm">${esc(o.t)}<small>${esc(t('pronos')(o.n))} · ${o.ex} ${esc(t('exactL'))}</small></span><span class="score">${o.pts}<small style="font-size:15px;color:var(--muted)"> pts</small></span></div>`).join('')}</div>
    <p class="muted" style="font-size:13px">${esc(t('legend'))}</p>
    <p class="sec">⚽🏉 ${esc(t('byMatch'))}</p>` + gs.map(table).join('')}`;
  app.querySelectorAll('tr[data-k]').forEach(tr => tr.onclick = () => go('admin=team:' + tr.dataset.g + ':' + encodeURIComponent(tr.dataset.k)));
  app.querySelectorAll('[data-open]').forEach(b => b.onclick = () => go('admin=rank:' + b.dataset.open));

   <div class="card stack"><p class="muted" style="font-size:14px;margin:0">${esc(t('exportT'))}</p><button class="btn" id="ex">⬇️ ${esc(t('export'))}</button>
   <button class="btn ghost small" id="bu" style="width:100%">${esc(t('backup'))}</button><label class="btn ghost small" style="width:100%">${esc(t('import'))}<input type="file" id="im" accept=".json,application/json" hidden></label></div>`;
  $('#sp').onclick = () => { const v = $('#np').value.trim(); if (v.length >= 4) { LS.set('lb_pin', v); toast(t('pinSaved')); $('#np').value = ''; } };
  if ($('#sb')) $('#sb').onclick = () => { LS.set('lb_base', $('#bu2').value.trim()); toast(t('pinSaved')); };
  $('#ex').onclick = () => { const json = JSON.stringify(allGames()).replace(/</g, '\\u003c'); download('index.html', SRC.replace(/(<script id="games-data" type="application\/json">)[\s\S]*?(<\/script>)/, (_, a, b) => a + json + b), 'text/html'); };
  $('#bu').onclick = () => download('labull-creations.json', JSON.stringify(myGames(), null, 1), 'application/json');
  $('#im').onchange = async e => { try { const arr = JSON.parse(await e.target.files[0].text()); const m = myGames(); for (const g of arr) { if (g && g.id && g.questions) { const i = m.findIndex(x => x.id === g.id); i >= 0 ? m[i] = g : m.push(g); } } saveMyGames(m); toast('✔ ' + arr.length); } catch (er) { toast('JSON ?', false); } };
}

route();

// Écran figé : pas de zoom (pincement / double tap), pas de glisser d'image
['gesturestart','gesturechange','gestureend'].forEach(e => document.addEventListener(e, ev => ev.preventDefault(), { passive: false }));
let _lastTap = 0;
document.addEventListener('touchend', ev => { const n = Date.now(); if (n - _lastTap < 350 && !ev.target.closest('input,textarea,select')) ev.preventDefault(); _lastTap = n; }, { passive: false });
document.addEventListener('touchmove', ev => { if (ev.touches.length > 1) ev.preventDefault(); }, { passive: false });
document.addEventListener('dragstart', ev => ev.preventDefault());
</script>
</body>
